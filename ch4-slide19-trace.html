<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Analyzer — live trace (ITI 103, Python Labs Chapter 4)</title>
<style>
  :root{
    --ink:#12202E;
    --ink-2:#1D3145;
    --paper:#FFFFFF;
    --panel:#F4F7FA;
    --line:#C7D5E2;
    --muted:#4A5C6E;
    --soft:#9FB3C8;
    --code-bg:#12202E;
    --code-fg:#E8EEF4;
    --kw:#FF8FA3;
    --str:#A8E6A1;
    --fn:#8FD3FF;
    --num:#F2C14E;
    --cmt:#9FB3C8;
    --rutgers:#A4002A;
    --hit:#F2C14E;
    --new:#A8E6A1;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.45;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 16px;font-size:14px}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  button{
    font:inherit;font-size:14px;padding:7px 13px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button:hover:not(:disabled){background:var(--panel)}
  button:focus-visible{outline:3px solid var(--rutgers);outline-offset:2px}
  button:disabled{opacity:.42;cursor:default}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  button.primary:hover:not(:disabled){background:var(--ink-2)}
  .spacer{flex:1 1 auto}
  .counter{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}

  .code{
    background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 0;
    font-family:var(--mono);font-size:14px;line-height:1.62;overflow-x:auto;
  }
  .cl{display:block;padding:0 16px;white-space:pre;border-left:4px solid transparent}
  .cl.on{background:rgba(242,193,78,.17);border-left-color:var(--hit)}
  .cl.dim{opacity:.42}
  .kw{color:var(--kw)} .str{color:var(--str)} .fn{color:var(--fn)}
  .num{color:var(--num)} .cmt{color:var(--cmt);font-style:italic}

  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:13px 14px;margin-bottom:14px}
  .card h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:700}

  .srcbox{
    font-family:var(--mono);font-size:13.5px;line-height:1.95;background:#fff;
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-height:56px
  }
  .tok{padding:1px 2px;border-radius:3px}
  .tok.chg{background:rgba(168,230,161,.55);font-weight:700}
  .tok.lifted{opacity:.3}
  .tok.nowtok{background:var(--hit);font-weight:700;border-radius:4px;padding:1px 4px}
  .ws{color:var(--soft)}
  .ws.cut{background:rgba(242,193,78,.45);color:#7a5c12;border-radius:3px}
  .nl{color:var(--soft);font-size:11px}
  .listwrap{display:flex;align-items:stretch;gap:4px;max-height:162px;overflow-y:auto}
  .dictwrap{display:flex;align-items:stretch;gap:4px;max-height:210px;overflow-y:auto}
  .brk{
    font-family:var(--mono);font-size:26px;line-height:1;color:var(--soft);
    display:flex;align-items:center;flex:0 0 auto;font-weight:300
  }
  .brk{align-items:flex-start;padding-top:1px}
  .brk.close{align-items:flex-end;padding-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:5px 5px;flex:1 1 auto;align-content:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:1px}
  .ix{font-family:var(--mono);font-size:9px;color:var(--soft);line-height:1}
  .chip{
    font-family:var(--mono);font-size:13px;padding:2px 7px;border-radius:5px;
    background:#fff;border:1px solid var(--line);color:var(--muted)
  }
  .cell.done .chip{opacity:.42}
  .cell.done .ix{opacity:.42}
  .cell.now .chip{background:var(--hit);border-color:#c79a24;color:var(--ink);font-weight:700;opacity:1}
  .cell.now .ix{color:var(--ink);font-weight:700;opacity:1}

  .dict{font-family:var(--mono);font-size:14px;min-height:150px;flex:1 1 auto}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 8px;border-radius:5px}
  .row .v{font-weight:700}
  .row.touch{background:rgba(242,193,78,.34)}
  .row.fresh{background:rgba(168,230,161,.42)}
  .empty{color:var(--soft);font-style:italic;font-family:var(--sans)}
  .dictcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px 14px}

  .say{
    border:1px solid var(--line);border-left:5px solid var(--rutgers);border-radius:8px;
    background:#fff;padding:11px 13px;min-height:62px
  }
  .say .tag{
    display:inline-block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    font-weight:700;color:#fff;background:var(--rutgers);border-radius:4px;padding:1px 7px;margin-right:8px
  }
  .say code{font-family:var(--mono);background:var(--panel);padding:1px 4px;border-radius:4px}

  details{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel)}
  summary{cursor:pointer;font-weight:600}
  summary:focus-visible{outline:3px solid var(--rutgers);outline-offset:2px}
  textarea{
    width:100%;min-height:110px;margin-top:10px;font-family:var(--mono);font-size:13px;
    padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);resize:vertical
  }
  .preset{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <h1>The whole program, end to end</h1>
  <p class="sub">Step through the four moves one pass at a time. Watch which branch runs and what the dictionary holds afterwards.</p>

  <div class="bar">
    <button id="reset">&#8635; Reset</button>
    <button id="back">&#8592; Back</button>
    <button id="step" class="primary">Step &#8594;</button>
    <button id="play">&#9654; Play</button>
    <button id="end">Skip to end</button>
    <span class="spacer"></span>
    <span class="counter" id="counter">step 0 of 0</span>
  </div>

  <div class="grid">
    <div>
      <div class="code" id="code"></div>
    </div>

    <div>
      <div class="card">
        <h2>lyrics &#183; <span id="srcmeta"></span></h2>
        <div class="srcbox" id="srcbox"></div>
      </div>

      <div class="card">
        <h2>words &#183; <span id="wordmeta"></span></h2>
        <div class="listwrap">
          <span class="brk">[</span>
          <div class="chips" id="chips"></div>
          <span class="brk close">]</span>
        </div>
      </div>

      <div class="card">
        <h2>word_count &#183; <span id="dictmeta"></span></h2>
        <div class="dictwrap">
          <span class="brk">{</span>
          <div class="dict" id="dict"></div>
          <span class="brk close">}</span>
        </div>
      </div>

      <div class="say" id="say" aria-live="polite">
        <span class="tag">Start</span>Press Step to run the first line.
      </div>
    </div>
  </div>

  <details>
    <summary>Run it on different text</summary>
    <div class="preset">
      <button data-preset="0">Major-General&#39;s Song, 1879 (verse 1)</button>
      <button data-preset="1">Modern Python Programmer (refrain)</button>
      <button data-preset="2">Modern Python Programmer (full verse)</button>
      <button data-preset="3">Watch Me Now (funk chorus)</button>
      <button data-preset="4">Run It Back (chorus)</button>
      <button data-preset="5">Happy Birthday</button>
      <button data-preset="6">Gettysburg Address (opening)</button>
    </div>
    <label class="sr" for="src">Text to analyze</label>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="preset"><button id="load" class="primary">Load this text</button></div>
  </details>

</div>

<script>
(function(){
  "use strict";
  var Q = '"""';

  var PRESETS = [
    "I am the very model of a modern Major-General,\nI've information vegetable, animal, and mineral,\nI know the kings of England, and I quote the fights historical\nFrom Marathon to Waterloo, in order categorical;\nI'm very well acquainted, too, with matters mathematical,\nI understand equations, both the simple and quadratical,\nAbout binomial theorem I'm teeming with a lot o' news,\nWith many cheerful facts about the square of the hypotenuse.\nI'm very good at integral and differential calculus;\nI know the scientific names of beings animalculous:\nIn short, in matters vegetable, animal, and mineral,\nI am the very model of a modern Major-General.\nIn short, in matters vegetable, animal, and mineral,\nHe is the very model of a modern Major-General!",
    "i am the very model of a modern python programmer\ni lower it and split it and i count up every parameter\nhe is the very model of a modern python programmer\nhe is the very model of a modern python programmer",
    "i am the very model of a modern python programmer\ni'm fluent in my lists and loops and every kind of parameter\ni hold a song in triple quotes and never mind how long it grows\ni lower it and split it into words the whitespace clearly shows\ni start an empty dictionary above the loop not down inside\ni check if word in word_count and i let the branches decide\nand if the word is there i add one more and let the number climb\nand if it isn't there at all i set the key to one each time\nand if it isn't there at all he sets the key to one each time\nhe is the very model of a modern python programmer",
    "watch me now watch me now\nthe block is gold when the lights go down\nwatch me now watch me now\nsay it loud say it twice\nwatch me now",
    "we run it back we run it back\nthe lights go down the lights go up\nwe run it back again",
    "happy birthday to you\nhappy birthday to you\nhappy birthday dear friend\nhappy birthday to you",
    "Four score and seven years ago\nour fathers brought forth on this continent\na new nation conceived in Liberty and\ndedicated to the proposition that all men\nare created equal"
  ];

  var lyricLines = PRESETS[0].split("\n");
  var codeLines = [], marks = {}, steps = [], idx = 0, timer = null;

  var elCode = document.getElementById("code"),
      elChips = document.getElementById("chips"),
      elDict = document.getElementById("dict"),
      elSay = document.getElementById("say"),
      elCount = document.getElementById("counter"),
      elWordMeta = document.getElementById("wordmeta"),
      elSrcBox = document.getElementById("srcbox"),
      elSrcMeta = document.getElementById("srcmeta"),
      elDictMeta = document.getElementById("dictmeta"),
      elSrc = document.getElementById("src");

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function color(line){
    if(line.trim().charAt(0) === "#") return '<span class="cmt">' + esc(line) + "</span>";
    var out = esc(line);
    out = out.replace(/(&quot;|")/g, "$1");
    out = out.replace(/\b(for|in|if|else|print|lower|split)\b/g, function(m){
      return (m === "print" || m === "lower" || m === "split")
        ? '<span class="fn">' + m + "</span>"
        : '<span class="kw">' + m + "</span>";
    });
    out = out.replace(/\b(1)\b/g, '<span class="num">1</span>');
    return out;
  }

  function buildCode(){
    codeLines = []; marks = {};
    var n = lyricLines.length;
    for(var i=0;i<n;i++){
      var t = (i===0 ? "lyrics = " + Q + lyricLines[0] : lyricLines[i]);
      if(i === n-1) t += Q;
      codeLines.push({raw:t, str:true});
    }
    marks.lyricEnd = codeLines.length - 1;
    codeLines.push({raw:""});
    codeLines.push({raw:"# 1. normalize, then split", cmt:true});
    marks.split = codeLines.length; codeLines.push({raw:"words = lyrics.lower().split()"});
    codeLines.push({raw:""});
    codeLines.push({raw:"# 2. empty tally, before the loop", cmt:true});
    marks.dict = codeLines.length; codeLines.push({raw:"word_count = {}"});
    codeLines.push({raw:""});
    codeLines.push({raw:"# 3. one pass per word", cmt:true});
    marks.forL = codeLines.length; codeLines.push({raw:"for word in words:"});
    marks.ifL  = codeLines.length; codeLines.push({raw:"    if word in word_count:"});
    marks.inc  = codeLines.length; codeLines.push({raw:"        word_count[word] += 1"});
    marks.elseL= codeLines.length; codeLines.push({raw:"    else:"});
    marks.set  = codeLines.length; codeLines.push({raw:"        word_count[word] = 1"});
    codeLines.push({raw:""});
    codeLines.push({raw:"# 4. report after the loop finishes", cmt:true});
    marks.print= codeLines.length; codeLines.push({raw:"print(word_count)"});

    elCode.innerHTML = codeLines.map(function(l,i){
      var html;
      if(l.cmt) html = '<span class="cmt">' + esc(l.raw) + "</span>";
      else if(l.str) html = '<span class="str">' + esc(l.raw) + "</span>";
      else html = color(l.raw);
      return '<span class="cl" id="L' + i + '">' + (l.raw === "" ? "&nbsp;" : html) + "</span>";
    }).join("");
  }

  function segments(text){
    var segs = [], re = /\s+/g, last = 0, m, wi = 0;
    while((m = re.exec(text)) !== null){
      if(m.index > last){ segs.push({t:"w", i:wi++, s:text.slice(last, m.index)}); }
      segs.push({t:"s", s:m[0]});
      last = m.index + m[0].length;
    }
    if(last < text.length) segs.push({t:"w", i:wi++, s:text.slice(last)});
    return segs;
  }

  function renderSrc(phase, k){
    var txt = lyricLines.join("\n");
    if(!phase){
      elSrcBox.innerHTML = '<span class="empty">press Step to begin</span>';
      elSrcMeta.textContent = txt.length + " characters";
      return;
    }
    var cutting = (phase === "cuts" || phase === "split");
    elSrcBox.innerHTML = segments(txt).map(function(g){
      if(g.t === "s"){
        var vis = g.s.replace(/\n/g, '<span class="nl">&#9166;</span><br>')
                     .replace(/ /g, "&middot;").replace(/\t/g, "&rarr;");
        return '<span class="ws' + (cutting ? " cut" : "") + '">' + vis + "</span>";
      }
      var w = (phase === "raw") ? g.s : g.s.toLowerCase();
      var cls = "tok";
      if(phase === "lower" && g.s !== g.s.toLowerCase()) cls += " chg";
      if(phase === "split"){ cls += (g.i < k) ? " lifted" : (g.i === k ? " nowtok" : ""); }
      if(phase === "done") cls += " lifted";
      return '<span class="' + cls + '">' + esc(w) + "</span>";
    }).join("");
    elSrcMeta.textContent = (phase === "raw" || phase === "lower")
      ? txt.length + " characters, one string"
      : txt.length + " characters";
  }

  function buildSteps(){
    var words = lyricLines.join("\n").toLowerCase().split(/\s+/).filter(Boolean);
    steps = [];
    var src = lyricLines.join("\n");
    var base = {wi:-1, dict:[], touch:null, nCells:0};

    steps.push({
      lines:[0, marks.lyricEnd], src:"raw", wi:-1, dict:[], touch:null, nCells:0,
      tag: "One string",
      text: "Everything between the triple quotes is <b>a single string</b>, " + src.length
            + " characters long, spaces and line breaks included. <code>len(lyrics)</code> would say "
            + src.length + ". That is not a word count."
    });
    steps.push({
      lines:[marks.split], src:"lower", wi:-1, dict:[], touch:null, nCells:0,
      tag: "lower()",
      text: "<code>lower()</code> goes first and hands back a <b>new string</b> of the same length, every capital folded down. Nothing has been broken apart yet."
    });
    steps.push({
      lines:[marks.split], src:"cuts", wi:-1, dict:[], touch:null, nCells:0,
      tag: "split()",
      text: "<code>split()</code> hunts for whitespace. Every highlighted run is a <b>cut</b> — spaces and line breaks alike. A run of several spaces is one cut, which is why no empty items appear."
    });
    for(var q=0;q<words.length;q++){
      steps.push({
        lines:[marks.split], src:"split", srcIdx:q, nCells:q+1, cellNow:q,
        wi:-1, dict:[], touch:null,
        tag: "Piece " + (q+1),
        text: "The text between two cuts becomes <code>words[" + q + "]</code>. It is a <b>string of its own</b> now, and the whitespace around it is thrown away."
      });
    }
    steps.push({
      lines:[marks.split], src:"done", nCells:words.length, wi:-1, dict:[], touch:null,
      tag: "One list",
      text: "One string in, <b>" + words.length + "</b> strings out. <code>len(words)</code> is "
            + words.length + ". From here the program never touches the original string again."
    });

    steps.push({
      line: marks.dict, wi: -1, dict: [], touch: null, src:"done", nCells:words.length,
      tag: "Empty tally",
      text: "The tally is created <b>empty and above the loop</b>. Put this line inside the loop instead and every pass wipes it."
    });

    var seen = {}, order = [];
    for(var i=0;i<words.length;i++){
      var w = words[i], known = Object.prototype.hasOwnProperty.call(seen, w);
      steps.push({
        line: marks.ifL, sec: marks.forL, wi: i, src:"done", nCells:words.length,
        dict: order.map(function(k){return [k, seen[k]];}), touch: null,
        tag: "Pass " + (i+1),
        text: "<code>word</code> is <code>" + esc(w) + "</code>. The <code>if</code> asks whether that key already exists. "
              + (known ? "<b>It does</b>, so the <code>if</code> branch runs." : "<b>It does not</b>, so the <code>else</code> branch runs.")
      });
      if(known){ seen[w] += 1; } else { seen[w] = 1; order.push(w); }
      steps.push({
        line: known ? marks.inc : marks.set, sec: known ? null : marks.elseL, wi: i,
        src:"done", nCells:words.length, dict: order.map(function(k){return [k, seen[k]];}),
        touch: {key:w, fresh:!known},
        tag: "Pass " + (i+1),
        text: known
          ? "<code>+= 1</code> adds one in place. <code>" + esc(w) + "</code> goes to <b>" + seen[w] + "</b>. The dictionary does not grow."
          : "Assigning a key that is not there yet <b>creates</b> it, starting at <b>1</b>, not 0. The dictionary grows by one entry."
      });
    }

    var top = order.slice().sort(function(a,b){return seen[b]-seen[a];})[0];
    steps.push({
      line: marks.print, wi: words.length, src:"done", nCells:words.length, dict: order.map(function(k){return [k, seen[k]];}), touch: null,
      tag: "Move 4",
      text: "The loop is finished, so <code>print</code> sits back at the left margin. <b>" + words.length
            + "</b> words in, <b>" + order.length + "</b> entries out. Most frequent: <code>" + esc(top) + "</code> at <b>" + seen[top] + "</b>."
    });
    idx = 0;
  }

  function render(){
    var s = idx === 0 ? null : steps[idx-1];
    var hot = [];
    if(s){
      if(s.lines) hot = s.lines.slice();
      else { hot.push(s.line); if(s.sec != null) hot.push(s.sec); }
    }
    for(var i=0;i<codeLines.length;i++){
      var el = document.getElementById("L"+i);
      el.className = "cl" + (hot.indexOf(i) >= 0 ? " on" : "");
    }

    renderSrc(s ? s.src : null, s ? s.srcIdx : -1);

    var words = lyricLines.join("\n").toLowerCase().split(/\s+/).filter(Boolean);
    var wi = s ? s.wi : -1;
    var nC = s ? (s.nCells != null ? s.nCells : words.length) : 0;
    var hi = s && s.cellNow != null ? s.cellNow : wi;
    elChips.innerHTML = words.slice(0, nC).map(function(w,i){
      var c = "cell" + (i===hi ? " now" : (i<wi ? " done" : ""));
      return '<span class="' + c + '"><span class="chip">&#39;' + esc(w)
           + '&#39;</span><span class="ix">' + i + "</span></span>";
    }).join("");
    elWordMeta.textContent = nC + " of " + words.length + " words";

    var d = s ? s.dict : [];
    if(!d.length){
      elDict.innerHTML = '<div class="empty">empty &#8212; nothing seen yet</div>';
    } else {
      elDict.innerHTML = '<div class="dictcols">' + d.map(function(p){
        var cls = "row";
        if(s.touch && s.touch.key === p[0]) cls += s.touch.fresh ? " fresh" : " touch";
        return '<div class="' + cls + '"><span>' + esc(p[0]) + '</span><span class="v">' + p[1] + "</span></div>";
      }).join("") + "</div>";
    }
    elDictMeta.textContent = d.length + " unique";

    elSay.innerHTML = s
      ? '<span class="tag">' + s.tag + "</span>" + s.text
      : '<span class="tag">Start</span>Press Step to run the first line.';

    elCount.textContent = "step " + idx + " of " + steps.length;
    document.getElementById("step").disabled = idx >= steps.length;
    document.getElementById("end").disabled = idx >= steps.length;
    document.getElementById("back").disabled = idx <= 0;
    if(idx >= steps.length) stop();
  }

  function stop(){
    if(timer){ clearInterval(timer); timer = null; }
    document.getElementById("play").innerHTML = "&#9654; Play";
  }
  function fwd(){ if(idx < steps.length){ idx++; render(); } else stop(); }

  document.getElementById("step").onclick = function(){ stop(); fwd(); };
  document.getElementById("back").onclick = function(){ stop(); if(idx>0){ idx--; render(); } };
  document.getElementById("reset").onclick = function(){ stop(); idx = 0; render(); };
  document.getElementById("end").onclick = function(){ stop(); idx = steps.length; render(); };
  document.getElementById("play").onclick = function(){
    if(timer){ stop(); return; }
    if(idx >= steps.length) idx = 0;
    this.innerHTML = "&#10073;&#10073; Pause";
    timer = setInterval(fwd, 800);
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function(b){
    b.onclick = function(){ elSrc.value = PRESETS[+b.getAttribute("data-preset")]; };
  });
  document.getElementById("load").onclick = function(){
    var t = elSrc.value.replace(/\r/g,"").trim();
    if(!t) return;
    lyricLines = t.split("\n").slice(0,16);
    stop(); buildCode(); buildSteps(); render();
  };

  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ stop(); fwd(); e.preventDefault(); }
    if(e.key === "ArrowLeft"){ stop(); if(idx>0){ idx--; render(); } e.preventDefault(); }
  });

  elSrc.value = PRESETS[1];
